<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Lo que un buscador lee sin ejecutar nada. El título y la descripción son
      el texto que sale en el resultado de Google: «Lucía» a secas no decía de
      qué app se trata, y «una app de GLL» tampoco.

      La canónica va aquí, en el HTML que se sirve para TODA ruta: la app es de
      una sola página, así que /ventas/facturas y /pos devuelven esta misma
      pantalla de acceso. Sin canónica, el buscador las trataría como páginas
      distintas con el mismo contenido y competirían entre sí.
    -->
    <title>Lucía by GLL · Ingresar</title>
    <meta name="application-name" content="Lucía" />
    <meta name="description" content="Ingresa a Lucía, la app de contabilidad con IA de GLL Consulting para PyMEs en Guatemala." />
    <link rel="canonical" href="https://lucia.gllconsulting.com/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/lucia-icon-180.png" />

    <!-- PWA / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lucía" />
    <meta name="theme-color" content="#1faec2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
