# Verificación de cada cambio antes de que llegue a master.
# El proyecto no tenía ninguna: hasta ahora el único control era acordarse de
# ejecutar `npm run typecheck` antes de subir.
#
# El revisor de estilo detiene el cambio por errores, no por avisos. Los errores
# están hoy en cero y ahí deben quedarse. Los avisos que quedan son casi todos
# `any` heredados: retirarlos es un trabajo aparte y no debe bloquear a nadie
# mientras tanto.
name: Verificación

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verificacion:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript sin errores
        run: npm run typecheck

      - name: Revisor de estilo sin errores
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilación de producción
        run: npm run build
